<!DOCTYPE html>

<body>

    <!-- ===== SPLASH SCREEN 4L ACADEMY =====
         Aparece 1x por sessão (a cada abertura do app), some sozinha.
         Inline de propósito: renderiza ANTES do CSS externo carregar. -->
    <div id="splash-4l" aria-hidden="true">
        <div class="splash-inner">
            <div class="splash-logo-wrap">
                <span class="splash-onda"></span>
                <span class="splash-onda delay"></span>
                <img src="4L.png" alt="4L Academy" class="splash-logo">
            </div>
            <h1 class="splash-titulo">4L <span>ACADEMY</span></h1>
            <p class="splash-sub">JIU-JITSU</p>
            <div class="splash-barra"><div class="splash-barra-fill"></div></div>
        </div>
    </div>
    <style>
        #splash-4l { position: fixed; inset: 0; z-index: 99999; background: #050507;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .55s ease, visibility .55s ease; }
        #splash-4l.saindo { opacity: 0; visibility: hidden; pointer-events: none; }
        #splash-4l .splash-inner { text-align: center; animation: splashSobe .7s cubic-bezier(.22,1,.36,1) both; }
        .splash-logo-wrap { position: relative; width: 130px; height: 130px; margin: 0 auto 18px; }
        .splash-logo { width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
            border: 3px solid #E53935; box-shadow: 0 0 0 5px rgba(229,57,53,.15), 0 0 45px rgba(229,57,53,.45);
            animation: splashPulsa 1.6s ease-in-out infinite; }
        .splash-onda { position: absolute; inset: -3px; border-radius: 50%;
            border: 2px solid rgba(229,57,53,.55); animation: splashOnda 1.8s ease-out infinite; }
        .splash-onda.delay { animation-delay: .9s; }
        .splash-titulo { font-family: Inter, system-ui, sans-serif; font-style: italic; font-weight: 800;
            font-size: 28px; letter-spacing: -0.5px; color: #fff; margin: 0 0 4px; }
        .splash-titulo span { color: #E53935; }
        .splash-sub { font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 700;
            letter-spacing: 5px; color: rgba(255,255,255,.45); margin: 0 0 26px; }
        .splash-barra { width: 150px; height: 3px; margin: 0 auto; border-radius: 3px;
            background: rgba(255,255,255,.1); overflow: hidden; }
        .splash-barra-fill { height: 100%; width: 0; border-radius: 3px; background: #E53935;
            box-shadow: 0 0 10px rgba(229,57,53,.7); animation: splashCarrega 1.8s ease-in-out forwards; }
        @keyframes splashSobe { from { opacity: 0; transform: translateY(18px) scale(.96); } to { opacity: 1; transform: none; } }
        @keyframes splashPulsa { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
        @keyframes splashOnda { from { transform: scale(1); opacity: .8; } to { transform: scale(1.65); opacity: 0; } }
        @keyframes splashCarrega { from { width: 0; } to { width: 100%; } }
        @media (prefers-reduced-motion: reduce) {
            #splash-4l .splash-inner, .splash-logo, .splash-onda, .splash-barra-fill { animation: none !important; }
            .splash-barra-fill { width: 100%; }
        }
    </style>
    <script>
    (function () {
        var splash = document.getElementById('splash-4l');
        if (!splash) return;
        // Mostra só 1x por sessão (a cada abertura do app)
        if (sessionStorage.getItem('splash4l_ok')) { splash.remove(); return; }
        sessionStorage.setItem('splash4l_ok', '1');
        var inicio = Date.now(), MINIMO = 1400, MAXIMO = 3500, fechou = false;
        function fechar() {
            if (fechou) return; fechou = true;
            splash.classList.add('saindo');
            setTimeout(function () { splash.remove(); }, 650);
        }
        window.addEventListener('load', function () {
            var falta = MINIMO - (Date.now() - inicio);
            setTimeout(fechar, Math.max(0, falta));
        });
        setTimeout(fechar, MAXIMO); // garantia: nunca trava o app
    })();
    </script>
    <!-- ===== FIM SPLASH SCREEN ===== -->


    <div class="banner-topo"></div>

    <div class="login-container">
        <h1 style="font-style: italic;">4L <span style="color: #E53935;">ACADEMY</span></h1>

        <form id="form-login">

            <div style="position: relative;">

                <button type="button" onclick="toggleSenha()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #666; cursor: pointer; width: auto; padding: 0; font-size: 18px;">👁️</button>
            </div>

            <button type="submit" class="btn-tactile">Entrar</button>
            <p id="msg-erro" style="color: #E53935; margin-top: 15px; font-size: 14px; font-weight: bold; height: 20px;"></p>

            <button type="button" id="btn-esqueci-senha" style="background: none; border: none; color: var(--cor-destaque); margin-top: 15px; font-size: 13px; font-weight: bold; cursor: pointer; width: auto;">
                Esqueci minha senha
            </button>

            <p style="margin-top: 20px; font-size: 13px; color: #aaaaaa;">
                Não tem uma conta? <a href="cadastro.html" style="color: var(--cor-destaque); text-decoration: none; font-weight: bold;">Cadastre-se aqui</a>
            </p>

            <div class="social-footer">
                <p class="social-title">Nossas Redes Sociais e Contato</p>

                <div class="social-icons">
                    <a href="https://www.instagram.com/4l_teamjj?igsh=MTZqZWF3eXB5YjBrNw%3D%3D&utm_source=qr" target="_blank" class="icon-metal">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="https://wa.me/5592985589868" target="_blank" class="icon-metal">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a href="https://wa.me/5592993507377" target="_blank" class="icon-metal">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                </div>

                <div class="social-info">
                    <div class="info-row">
                        <i class="fab fa-instagram" style="color: #ccc;"></i> <span>@4l_teamjj</span>
                    </div>
                    <div class="info-row">
                        <i class="fab fa-whatsapp" style="color: #25D366;"></i> <span>92 98558-9868 - Luane</span>
                    </div>
                    <div class="info-row">
                        <i class="fab fa-whatsapp" style="color: #25D366;"></i> <span>92 99350-7377 - Luan</span>
                    </div>
                </div>
            </div>

        </form>
    </div>

    <!-- Botão flutuante: Instalar o app (guia em instalar.html) -->
    <a href="/instalar.html" id="btn-instalar-app" style="
      position:fixed;bottom:20px;right:20px;z-index:99999;
      display:flex;align-items:center;gap:8px;
      background:#E53935;color:#fff;text-decoration:none;
      font:bold 13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      padding:12px 18px;border-radius:99px;
      box-shadow:0 6px 20px rgba(229,57,53,.45);">
      📲 Instalar o app
    </a>
    <script>
    // Esconde o botão para quem JÁ abriu pelo app instalado
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      var _bi = document.getElementById('btn-instalar-app');
      if (_bi) _bi.style.display = 'none';
    }
    </script>
</body>
